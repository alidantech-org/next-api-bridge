name: Apply 0.1.7 release preparation

on:
  push:
    branches:
      - chatgpt/release-0.1.7
    paths:
      - '.github/workflows/apply-release-0.1.7.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/release-0.1.7
          fetch-depth: 0

      - name: Restore validated release workspace
        shell: bash
        run: |
          cat .release/0.1.7/part-* | base64 --decode > /tmp/next-api-bridge-0.1.7.tar.gz
          echo 'badc9bacc5df00ba4c950da58ae8bb93e25bac6e864edd33b34b43b410c3ba1d  /tmp/next-api-bridge-0.1.7.tar.gz' | sha256sum --check
          tar -xzf /tmp/next-api-bridge-0.1.7.tar.gz -C .
          rm -rf .release
          rm -f .github/workflows/apply-release-0.1.7.yml

      - name: Generate synchronized package lock
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit release implementation
        shell: bash
        run: |
          git config user.name 'chatgpt-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden next-api-bridge for 0.1.7'
          git push origin HEAD:chatgpt/release-0.1.7
