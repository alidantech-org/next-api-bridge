name: Verify and apply 0.1.7 release preparation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }} / Next ${{ matrix.next }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        next: [15, 16]

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/release-0.1.7
          fetch-depth: 0
          show-progress: false

      - name: Restore validated release workspace
        shell: bash
        run: |
          cat .release/0.1.7/part-* | base64 --decode > /tmp/next-api-bridge-0.1.7.tar.gz
          echo 'badc9bacc5df00ba4c950da58ae8bb93e25bac6e864edd33b34b43b410c3ba1d  /tmp/next-api-bridge-0.1.7.tar.gz' | sha256sum --check
          tar -xzf /tmp/next-api-bridge-0.1.7.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/run.mjs')
          text = path.read_text()
          text = text.replace(
              "    '@playwright/test',\n",
              "    '@playwright/test',\n    'typescript@5.8.2',\n    '@types/react@19',\n    '@types/react-dom@19',\n",
          )
          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package dependencies
        run: npm install --no-audit --no-fund

      - name: Select Next.js test major
        run: npm install --no-save --no-audit --no-fund next@${{ matrix.next }}

      - name: Run strict release gates
        run: npm run test:matrix

      - name: Run packed production Next.js E2E
        id: e2e
        shell: bash
        run: |
          set +e
          npm run test:e2e > /tmp/e2e-node-${{ matrix.node }}-next-${{ matrix.next }}.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "E2E failed; uploading full diagnostic log"
            exit "$status"
          fi
        env:
          CI: 'true'
          NEXT_E2E_VERSION: ${{ matrix.next }}

      - name: Upload E2E diagnostics
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-node-${{ matrix.node }}-next-${{ matrix.next }}
          path: /tmp/e2e-node-${{ matrix.node }}-next-${{ matrix.next }}.log
          if-no-files-found: error
          retention-days: 3

  apply:
    name: Apply clean 0.1.7 workspace
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/release-0.1.7
          fetch-depth: 0
          show-progress: false

      - name: Restore verified release workspace
        shell: bash
        run: |
          cat .release/0.1.7/part-* | base64 --decode > /tmp/next-api-bridge-0.1.7.tar.gz
          echo 'badc9bacc5df00ba4c950da58ae8bb93e25bac6e864edd33b34b43b410c3ba1d  /tmp/next-api-bridge-0.1.7.tar.gz' | sha256sum --check
          tar -xzf /tmp/next-api-bridge-0.1.7.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/run.mjs')
          text = path.read_text()
          text = text.replace(
              "    '@playwright/test',\n",
              "    '@playwright/test',\n    'typescript@5.8.2',\n    '@types/react@19',\n    '@types/react-dom@19',\n",
          )
          path.write_text(text)
          PY
          rm -rf .release
          rm -f .github/workflows/apply-release-0.1.7.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate synchronized package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit verified release implementation
        shell: bash
        run: |
          git config user.name 'chatgpt-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden next-api-bridge for 0.1.7'
          git push origin HEAD:chatgpt/release-0.1.7
