name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version and tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if [[ "${LOCK_VERSION}" != "${VERSION}" ]]; then
            echo "::error::package.json (${VERSION}) and package-lock.json (${LOCK_VERSION}) versions do not match."
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable semantic versions can be published by this workflow. Found: ${VERSION}"
            exit 1
          fi

          if [[ ! -f RELEASE_NOTES.md ]]; then
            echo "::error::RELEASE_NOTES.md is required for publishing."
            exit 1
          fi

          RELEASE_TITLE="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
          if [[ -z "${RELEASE_TITLE}" || ( "${RELEASE_TITLE}" != "v${VERSION}" && "${RELEASE_TITLE}" != "v${VERSION} "* ) ]]; then
            echo "::error::RELEASE_NOTES.md must start with '# v${VERSION}' followed by an optional release title."
            exit 1
          fi

          if [[ -z "$(tail -n +2 RELEASE_NOTES.md | tr -d '[:space:]')" ]]; then
            echo "::error::RELEASE_NOTES.md must contain release notes below the title."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "::error::Manual publishing must be started from the main branch."
              exit 1
            fi

            MAIN_SHA="$(git rev-parse origin/main)"
            if [[ "${RELEASE_SHA}" != "${MAIN_SHA}" ]]; then
              echo "::error::main moved after this workflow started. Run the publish workflow again."
              exit 1
            fi

            if git show-ref --verify --quiet "refs/tags/${TAG}"; then
              echo "::error::Tag ${TAG} already exists."
              exit 1
            fi

            if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "::error::${PACKAGE_NAME}@${VERSION} is already published."
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "${PACKAGE_NAME} ${TAG}" "${RELEASE_SHA}"
            git push origin "refs/tags/${TAG}"
          else
            if [[ "${{ github.ref_name }}" != "${TAG}" ]]; then
              echo "::error::Tag ${{ github.ref_name }} does not match package version ${TAG}."
              exit 1
            fi
          fi

          if ! git branch -r --contains "${RELEASE_SHA}" | grep -q 'origin/main'; then
            echo "::error::Release commit must belong to main."
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release"
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  verify:
    name: Verify Node ${{ matrix.node }} / Next ${{ matrix.next }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        next: [15, 16]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify immutable release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${{ needs.release.outputs.sha }}"
          git branch -r --contains HEAD | grep -q 'origin/main'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm install --no-save next@${{ matrix.next }}
      - run: npm run test:matrix

  e2e:
    name: E2E Node ${{ matrix.node }} / Next ${{ matrix.next }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            next: 15
          - node: 22
            next: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify immutable release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${{ needs.release.outputs.sha }}"
          git branch -r --contains HEAD | grep -q 'origin/main'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run packed production Next.js E2E
        run: npm run test:e2e
        env:
          NEXT_E2E_VERSION: ${{ matrix.next }}
          CI: 'true'

  publish:
    name: Publish ${{ needs.release.outputs.tag }}
    needs:
      - release
      - verify
      - e2e
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Publish package
        run: npm publish

      - name: Verify package is installable from npm
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          REGISTRY="https://registry.npmjs.org"
          DELAYS=(10 20 40 80)

          for attempt in 1 2 3 4 5; do
            PUBLISHED_VERSION="$(
              npm view "${PACKAGE_NAME}@${VERSION}" version \
                --registry="${REGISTRY}" \
                --prefer-online \
                2>/dev/null || true
            )"

            if [[ "${PUBLISHED_VERSION}" == "${VERSION}" ]]; then
              TARBALL="$(
                npm pack "${PACKAGE_NAME}@${VERSION}" \
                  --ignore-scripts \
                  --registry="${REGISTRY}" \
                  --silent \
                  2>/dev/null || true
              )"

              if [[ -n "${TARBALL}" && -f "${TARBALL}" ]]; then
                echo "Verified ${PACKAGE_NAME}@${VERSION} is available from the public npm registry."
                rm -f "${TARBALL}"
                exit 0
              fi
            fi

            if (( attempt < 5 )); then
              DELAY="${DELAYS[$((attempt - 1))]}"
              echo "Registry has not exposed ${PACKAGE_NAME}@${VERSION} yet (attempt ${attempt}/5); retrying in ${DELAY}s."
              sleep "${DELAY}"
            fi
          done

          echo "::warning::npm accepted ${PACKAGE_NAME}@${VERSION}, but public registry propagation is still pending after 5 checks over about 2m30s."
          echo "The publish remains successful because npm already accepted the immutable package version."

  github_release:
    name: Create GitHub Release
    needs:
      - release
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify immutable release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.release.outputs.sha }}"

      - name: Create GitHub Release from current release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists."
            exit 0
          fi

          RELEASE_TITLE="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
          BODY_FILE="$(mktemp)"
          tail -n +2 RELEASE_NOTES.md | sed '1{/^[[:space:]]*$/d;}' > "${BODY_FILE}"

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TITLE}" \
            --notes-file "${BODY_FILE}"

