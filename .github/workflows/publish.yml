name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }} / Next ${{ matrix.next }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        next: [15, 16]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag commit belongs to main
        run: |
          git fetch origin main
          git branch -r --contains HEAD | grep -q 'origin/main'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm install --no-save next@${{ matrix.next }}
      - run: npm run test:matrix
      - name: Run packed production E2E
        run: npm run test:e2e
        env:
          NEXT_E2E_VERSION: ${{ matrix.next }}
          CI: 'true'

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
